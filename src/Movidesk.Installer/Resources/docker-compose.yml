services:
  superset:
    image: apache/superset:6.1.0
    container_name: advice_movidesk_superset
    restart: unless-stopped
    init: true
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-movidesk_superset_super_secret_key_2026}"
      SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ENV: "production"
      FLASK_APP: "superset.app:create_app()"
      PYTHONPATH: "/app/pythonpath"
      TZ: "America/Sao_Paulo"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  superset_home:
    name: advice_movidesk_superset_home
