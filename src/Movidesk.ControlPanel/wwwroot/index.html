<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Controle — Movidesk BI</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#cbd5e1;font-family:'Segoe UI',sans-serif;font-size:15px;">
            Carregando Painel de Controle Movidesk BI...
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado na interface do aplicativo.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">✕</a>
    </div>

    <script>
        window.movideskExec = {
            downloadTextFile: function (fileName, content, mimeType) {
                const blob = new Blob([content], { type: mimeType || "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },
            printPage: function () {
                window.print();
            },
            scrollToElement: function (elementId) {
                const el = document.getElementById(elementId);
                if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
            }
        };
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>

</html>
