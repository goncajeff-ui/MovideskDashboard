name: Build Windows Control Panel (.exe)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Movidesk.ControlPanel/**'
      - 'database/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish MovideskControlPanel.exe (win-x64 standalone)
        shell: pwsh
        run: dotnet publish src/Movidesk.ControlPanel/Movidesk.ControlPanel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/MovideskControlPanel

      - name: Ensure wwwroot is present alongside executable and validate bundle
        shell: pwsh
        run: |
          $pubDir = "publish/MovideskControlPanel"
          $wwwrootDest = Join-Path $pubDir "wwwroot"
          if (-not (Test-Path (Join-Path $wwwrootDest "index.html"))) {
            New-Item -ItemType Directory -Path $wwwrootDest -Force | Out-Null
            Copy-Item -Path "src/Movidesk.ControlPanel/wwwroot/*" -Destination $wwwrootDest -Recurse -Force
          }

          $required = @(
            (Join-Path $pubDir "MovideskControlPanel.exe"),
            (Join-Path $pubDir "appsettings.json"),
            (Join-Path $wwwrootDest "index.html"),
            (Join-Path $wwwrootDest "css/app.css")
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Arquivo obrigatorio ausente na publicacao: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/MovideskControlPanel/* -DestinationPath MovideskControlPanel-win-x64.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/MovideskControlPanel-win-x64.zip")
          Write-Host "Conteudo do ZIP:"
          $zip.Entries | ForEach-Object { Write-Host " - $($_.FullName) ($($_.Length) bytes)" }
          $zip.Dispose()

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovideskControlPanel-win-x64
          path: MovideskControlPanel-win-x64.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: control-panel-v1.0.${{ github.run_number }}
          name: Painel de Controle Movidesk BI v1.0.${{ github.run_number }} (Windows .exe)
          body: |
            Executável standalone para Windows 10/11 (x64) — não requer PowerShell para abrir.
            Extraia TODO o conteúdo do ZIP para uma pasta (mantendo `MovideskControlPanel.exe`, `appsettings.json` e a pasta `wwwroot` juntos) e execute `MovideskControlPanel.exe`.
          files: MovideskControlPanel-win-x64.zip
          prerelease: false
          make_latest: true
