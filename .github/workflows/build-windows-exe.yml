name: Build Windows Control Panel (.exe)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Movidesk.ControlPanel/**'
      - 'src/Movidesk.Installer/**'
      - 'Gerar_Instalador.bat'
      - 'database/**'
      - 'superset/**'
      - 'docs/manuais/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish MovideskControlPanel.exe (win-x64 standalone)
        shell: pwsh
        run: dotnet publish src/Movidesk.ControlPanel/Movidesk.ControlPanel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/MovideskControlPanel

      - name: Ensure wwwroot is present alongside executable and validate bundle
        shell: pwsh
        run: |
          $pubDir = "publish/MovideskControlPanel"
          $wwwrootDest = Join-Path $pubDir "wwwroot"
          if (-not (Test-Path (Join-Path $wwwrootDest "index.html"))) {
            New-Item -ItemType Directory -Path $wwwrootDest -Force | Out-Null
            Copy-Item -Path "src/Movidesk.ControlPanel/wwwroot/*" -Destination $wwwrootDest -Recurse -Force
          }

          $manuaisDest = Join-Path $pubDir "manuais"
          if (Test-Path "docs/manuais") {
            New-Item -ItemType Directory -Path $manuaisDest -Force | Out-Null
            Copy-Item -Path "docs/manuais/*.pdf" -Destination $manuaisDest -Force
          }

          if (Test-Path "superset/setup_superset_auto.py") {
            $pyRaw = [System.IO.File]::ReadAllText("superset/setup_superset_auto.py", [System.Text.Encoding]::UTF8)
            $pyLf = $pyRaw.Replace("`r`n", "`n").Replace("`r", "`n")
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText((Join-Path $pubDir "setup_superset_auto.py"), $pyLf, $utf8NoBom)
          }

          $required = @(
            (Join-Path $pubDir "MovideskControlPanel.exe"),
            (Join-Path $pubDir "appsettings.json"),
            (Join-Path $pubDir "setup_superset_auto.py"),
            (Join-Path $wwwrootDest "index.html"),
            (Join-Path $wwwrootDest "css/app.css")
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Arquivo obrigatorio ausente na publicacao: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Package ControlPanel ZIP and Embed in Installer
        shell: pwsh
        run: |
          Compress-Archive -Path publish/MovideskControlPanel/* -DestinationPath MovideskControlPanel-win-x64.zip -Force
          Copy-Item -Path MovideskControlPanel-win-x64.zip -Destination src/Movidesk.Installer/Resources/ControlPanel.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/MovideskControlPanel-win-x64.zip")
          Write-Host "Conteudo do ZIP:"
          $zip.Entries | ForEach-Object { Write-Host " - $($_.FullName) ($($_.Length) bytes)" }
          $zip.Dispose()

      - name: Publish MovideskInstaller.exe (Advice Installer 2.0 Single-File)
        shell: pwsh
        run: |
          dotnet publish src/Movidesk.Installer/Movidesk.Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/MovideskInstaller
          $exeSrc = "publish/MovideskInstaller/MovideskInstaller.exe"
          if (-not (Test-Path $exeSrc)) {
            throw "MovideskInstaller.exe nao foi gerado!"
          }
          $sizeMb = [Math]::Round((Get-Item $exeSrc).Length / 1MB, 2)
          Write-Host "OK: MovideskInstaller.exe gerado ($sizeMb MB)"
          if ($sizeMb -lt 15) {
            throw "MovideskInstaller.exe parece nao conter ControlPanel.zip embutido ($sizeMb MB)."
          }
          Copy-Item -Path $exeSrc -Destination MovideskInstaller-Dashboard-Movidesk-BI.exe -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovideskDashboard-Windows-Suite
          path: |
            MovideskInstaller-Dashboard-Movidesk-BI.exe
            MovideskControlPanel-win-x64.zip
            docs/manuais/*.pdf

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: control-panel-v1.0.${{ github.run_number }}
          name: Instalador Unificado + Painel de Controle Movidesk BI v1.0.${{ github.run_number }}
          body: |
            ### Pacote Oficial Advice Compliance Solutions — Movidesk BI
            - **`MovideskInstaller-Dashboard-Movidesk-BI.exe`**: **Instalador Visual Único (Advice Installer 2.0)** em .NET 8 WinForms com recursos embutidos (`ControlPanel.zip`, `advice.ico`, `docker-compose.yml`, `superset_config.py`, `setup_superset_auto.py` e scripts SQL). Realiza o deploy unificado completo em servidores Windows com WSL 2 Ubuntu, Docker, Apache Superset, Driver ODBC 18 (`msodbcsql18`) e provisionamento do **Dashboard - Movidesk BI**.
            - **`MovideskControlPanel-win-x64.zip`**: Pacote standalone do Painel de Controle Movidesk BI (.NET 8 + Blazor) para atualização avulsa.
            - **`Manual_01_Operacao_Painel_Controle_Movidesk_BI.pdf`**: Manual de Operação do Painel de Controle Movidesk BI (5 páginas).
            - **`Manual_02_Configuracao_Apache_Superset_Corporativo.pdf`**: Manual Passo a Passo de Configuração do Apache Superset (6 páginas).
            - **`Manual_03_Dicionario_de_Dados_Completo.pdf`**: Dicionário de Dados Exaustivo (13 páginas).
            - **`Manual_04_Leitura_Executiva_Dashboard_Movidesk_BI.pdf`**: Manual Executivo de Leitura — Dashboard - Movidesk BI (8 páginas).
            - **`Historico_Passo_a_Passo_Projeto.md`**: Memória cronológica passo a passo de todas as entregas e correções do projeto.
          files: |
            MovideskInstaller-Dashboard-Movidesk-BI.exe
            MovideskControlPanel-win-x64.zip
            docs/manuais/Manual_01_Operacao_Painel_Controle_Movidesk_BI.pdf
            docs/manuais/Manual_02_Configuracao_Apache_Superset_Corporativo.pdf
            docs/manuais/Manual_03_Dicionario_de_Dados_Completo.pdf
            docs/manuais/Manual_03_Dicionario_de_Dados_MovideskDM.pdf
            docs/manuais/Manual_04_Leitura_Executiva_Dashboard_Movidesk_BI.pdf
            docs/manuais/Historico_Passo_a_Passo_Projeto.md
          prerelease: false
          make_latest: true
